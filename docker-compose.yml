version: '3.8'

services:
  # 1. The Core Simulation (Headless computation)
  jsbsim-core:
    image: python:3.10-slim
    volumes:
      - ./simulation_workspace:/workspace
    working_dir: /workspace
    # Install dependencies and then run the JSBSim script
    command: >
      bash -c "
      sleep 3 &&
      jsbsim --root=jsbsim --script=scripts/f16_runway_test.xml --logdirectivefile=udp_out.xml --realtime
      "
    depends_on:
      - udp-listener
    #depends_on:
    #  - flightgear-visualizer


  # The basic UDP telemetry receiver
  udp-listener:
    image: python:3.11-slim
    container_name: jsb_udp_listener
    environment:
      - PYTHONUNBUFFERED=1  # Forces Python to print instantly
    volumes:
      - ./listener.py:/app/listener.py:Z
    working_dir: /app
    command: python -u listener.py

